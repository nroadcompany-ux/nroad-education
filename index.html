<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design System Refs</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #3182f6;
      --blue-light: #e8f3ff;
      --grey-50: #f9fafb;
      --grey-100: #f2f4f6;
      --grey-200: #e5e8eb;
      --grey-500: #8b95a1;
      --grey-700: #4e5968;
      --grey-900: #191f28;
      --sidebar-w: 260px;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--grey-100);
      color: var(--grey-900);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      height: 56px;
      background: #fff;
      border-bottom: 1px solid var(--grey-200);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .logo { font-size: 17px; font-weight: 700; color: var(--blue); letter-spacing: -0.3px; }
    .logo span { color: var(--grey-900); }

    .header-badge {
      font-size: 12px; font-weight: 600;
      background: var(--blue-light); color: var(--blue);
      border-radius: 6px; padding: 2px 8px;
    }

    .header-count {
      margin-left: auto;
      font-size: 13px; color: var(--grey-500);
    }

    /* Layout */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: var(--sidebar-w);
      background: #fff;
      border-right: 1px solid var(--grey-200);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .search-wrap {
      padding: 12px 16px;
      border-bottom: 1px solid var(--grey-200);
    }

    .search-wrap input {
      width: 100%;
      height: 36px;
      background: var(--grey-100);
      border: none;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--grey-900);
      outline: none;
    }

    .search-wrap input::placeholder { color: var(--grey-500); }
    .search-wrap input:focus { box-shadow: 0 0 0 2px var(--blue); }

    .brand-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }

    .brand-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      height: 44px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--grey-700);
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }

    .brand-item:hover { background: var(--grey-50); }

    .brand-item.active {
      background: var(--blue-light);
      color: var(--blue);
      border-left-color: var(--blue);
      font-weight: 600;
    }

    .brand-icon {
      width: 24px; height: 24px;
      border-radius: 6px;
      background: var(--grey-100);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--grey-700);
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .brand-item.active .brand-icon {
      background: var(--blue);
      color: #fff;
    }

    .no-result {
      padding: 24px 16px;
      font-size: 13px;
      color: var(--grey-500);
      text-align: center;
    }

    /* Main content */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 40px 48px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--grey-500);
      gap: 12px;
    }

    .empty-state .icon { font-size: 48px; }
    .empty-state p { font-size: 15px; }

    /* Markdown */
    .md-wrap {
      max-width: 760px;
      background: #fff;
      border-radius: 16px;
      padding: 40px 48px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08);
    }

    .md-wrap h1 { font-size: 24px; font-weight: 700; color: var(--grey-900); letter-spacing: -0.3px; margin-bottom: 8px; }
    .md-wrap h2 { font-size: 18px; font-weight: 600; color: var(--grey-900); margin-top: 40px; margin-bottom: 16px; padding-top: 16px; border-top: 1px solid var(--grey-200); }
    .md-wrap h2:first-of-type { border-top: none; padding-top: 0; }
    .md-wrap h3 { font-size: 15px; font-weight: 600; color: var(--grey-700); margin-top: 24px; margin-bottom: 10px; }
    .md-wrap p { font-size: 15px; color: #333d4b; line-height: 1.7; margin-bottom: 12px; }
    .md-wrap blockquote { border-left: 3px solid var(--blue); background: var(--blue-light); border-radius: 0 8px 8px 0; padding: 12px 16px; margin: 16px 0 24px; }
    .md-wrap blockquote p { color: #2272eb; font-size: 14px; margin: 0; }
    .md-wrap ul, .md-wrap ol { padding-left: 20px; margin-bottom: 16px; }
    .md-wrap li { font-size: 15px; color: #333d4b; margin-bottom: 5px; line-height: 1.6; }
    .md-wrap hr { border: none; border-top: 1px solid var(--grey-200); margin: 28px 0; }
    .md-wrap strong { font-weight: 600; color: var(--grey-900); }
    .md-wrap code { font-family: 'SF Mono', Consolas, monospace; font-size: 13px; background: var(--grey-100); color: var(--blue); padding: 2px 6px; border-radius: 4px; }
    .md-wrap pre { background: var(--grey-50); border: 1px solid var(--grey-200); border-radius: 10px; padding: 20px; overflow-x: auto; margin: 14px 0 20px; }
    .md-wrap pre code { background: none; color: #333d4b; padding: 0; font-size: 13px; line-height: 1.7; }
    .md-wrap table { width: 100%; border-collapse: collapse; margin: 14px 0 20px; font-size: 14px; border-radius: 10px; overflow: hidden; border: 1px solid var(--grey-200); }
    .md-wrap thead { background: var(--grey-50); }
    .md-wrap th { padding: 10px 14px; text-align: left; font-weight: 600; font-size: 13px; color: var(--grey-700); border-bottom: 1px solid var(--grey-200); }
    .md-wrap td { padding: 10px 14px; border-bottom: 1px solid var(--grey-100); color: #333d4b; font-size: 14px; vertical-align: top; }
    .md-wrap tr:last-child td { border-bottom: none; }
    .md-wrap tbody tr:hover { background: var(--grey-50); }

    /* Mobile */
    @media (max-width: 768px) {
      aside { width: 100%; display: none; }
      aside.open { display: flex; position: fixed; inset: 56px 0 0 0; width: 100%; z-index: 20; }
      main { padding: 24px 16px; }
      .md-wrap { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">nroad <span>education</span></span>
  <span class="header-badge">Design Refs</span>
  <span class="header-count" id="count"></span>
</header>

<div class="layout">
  <aside>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="브랜드 검색..." autocomplete="off" />
    </div>
    <div class="brand-list" id="brandList"></div>
  </aside>

  <main id="main">
    <div class="empty-state">
      <div class="icon">📐</div>
      <p>왼쪽에서 브랜드를 선택하세요</p>
    </div>
  </main>
</div>

<script>
  const brands = ["airbnb","airtable","apple","binance","bmw","bmw-m","bugatti","cal","claude","clay","clickhouse","cohere","coinbase","composio","cursor","elevenlabs","expo","ferrari","figma","framer","hashicorp","ibm","intercom","kraken","lamborghini","linear.app","lovable","mastercard","meta","minimax","mintlify","miro","mistral.ai","mongodb","nike","notion","nvidia","ollama","opencode.ai","pinterest","playstation","posthog","raycast","renault","replicate","resend","revolut","runwayml","sanity","sentry","shopify","slack","spacex","spotify","starbucks","stripe","supabase","superhuman","tesla","theverge","together.ai","toss","uber","vercel","vodafone","voltagent","warp","webflow","wired","wise","x.ai","zapier"];

  document.getElementById('count').textContent = `${brands.length}개 브랜드`;

  let current = null;
  const cache = {};

  function renderList(filter = '') {
    const list = document.getElementById('brandList');
    const filtered = brands.filter(b => b.toLowerCase().includes(filter.toLowerCase()));
    if (filtered.length === 0) {
      list.innerHTML = '<div class="no-result">검색 결과 없음</div>';
      return;
    }
    list.innerHTML = filtered.map(b => `
      <div class="brand-item ${b === current ? 'active' : ''}" data-brand="${b}" onclick="loadBrand('${b}')">
        <div class="brand-icon">${b[0]}</div>
        ${b}
      </div>
    `).join('');
  }

  async function loadBrand(brand) {
    current = brand;
    renderList(document.getElementById('search').value);

    const main = document.getElementById('main');
    main.innerHTML = '<div class="empty-state"><p>불러오는 중...</p></div>';

    try {
      let md;
      if (cache[brand]) {
        md = cache[brand];
      } else {
        const res = await fetch(`design-md/${brand}/DESIGN.md`);
        if (!res.ok) throw new Error('not found');
        md = await res.text();
        cache[brand] = md;
      }
      main.innerHTML = `<div class="md-wrap">${marked.parse(md)}</div>`;
      main.scrollTop = 0;
    } catch {
      main.innerHTML = '<div class="empty-state"><p>파일을 불러올 수 없습니다.</p></div>';
    }
  }

  document.getElementById('search').addEventListener('input', e => {
    renderList(e.target.value);
  });

  renderList();
</script>
</body>
</html>
