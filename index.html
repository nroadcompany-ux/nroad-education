<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nroad education — Design Refs</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #3182f6; --blue-light: #e8f3ff; --blue-hover: #c9e2ff;
      --g50: #f9fafb; --g100: #f2f4f6; --g200: #e5e8eb;
      --g400: #b0b8c1; --g500: #8b95a1; --g600: #6b7684;
      --g700: #4e5968; --g800: #333d4b; --g900: #191f28;
      --sidebar: 280px;
    }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--g100); color: var(--g900);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ── Header ── */
    header {
      height: 52px; background: #fff; border-bottom: 1px solid var(--g200);
      display: flex; align-items: center; padding: 0 20px; gap: 10px;
      flex-shrink: 0; z-index: 10;
    }
    .logo { font-size: 16px; font-weight: 700; color: var(--blue); letter-spacing: -0.3px; }
    .logo span { color: var(--g900); }
    .badge { font-size: 11px; font-weight: 600; background: var(--blue-light); color: var(--blue); border-radius: 5px; padding: 2px 7px; }
    .hcount { margin-left: auto; font-size: 12px; color: var(--g500); }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar); background: #fff;
      border-right: 1px solid var(--g200);
      display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
    }
    .search-wrap { padding: 10px 12px; border-bottom: 1px solid var(--g200); }
    .search-wrap input {
      width: 100%; height: 34px; background: var(--g100);
      border: none; border-radius: 7px; padding: 0 10px;
      font-size: 13px; font-family: inherit; color: var(--g900); outline: none;
    }
    .search-wrap input::placeholder { color: var(--g500); }
    .search-wrap input:focus { box-shadow: 0 0 0 2px var(--blue); }

    .sec-label {
      padding: 10px 14px 4px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
      color: var(--g400); text-transform: uppercase;
    }
    .brand-list { overflow-y: auto; flex: 1; padding-bottom: 16px; }

    /* brand row (depth 1) */
    .brand-row {
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px; height: 38px; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--g700);
      border-left: 3px solid transparent;
      user-select: none;
    }
    .brand-row:hover { background: var(--g50); }
    .brand-row.open { color: var(--g900); }
    .b-icon {
      width: 22px; height: 22px; border-radius: 5px;
      background: var(--g100); display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 700;
      color: var(--g600); flex-shrink: 0; text-transform: uppercase;
    }
    .brand-row.open .b-icon { background: var(--g900); color: #fff; }
    .b-name { flex: 1; }
    .b-arrow { font-size: 10px; color: var(--g400); transition: transform 0.15s; }
    .brand-row.open .b-arrow { transform: rotate(90deg); }

    /* sub items (depth 2) */
    .sub-list { display: none; }
    .sub-list.open { display: block; }
    .sub-item {
      display: flex; align-items: center; gap: 7px;
      padding: 0 12px 0 36px; height: 34px; cursor: pointer;
      font-size: 12px; color: var(--g600);
      border-left: 3px solid transparent;
      user-select: none;
    }
    .sub-item:hover { background: var(--g50); color: var(--g800); }
    .sub-item.active {
      background: var(--blue-light); color: var(--blue);
      border-left-color: var(--blue); font-weight: 600;
    }
    .sub-icon { font-size: 12px; flex-shrink: 0; }
    .no-result { padding: 20px 14px; font-size: 13px; color: var(--g500); text-align: center; }

    /* ── Main ── */
    main { flex: 1; overflow: hidden; position: relative; }

    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; color: var(--g400); gap: 10px;
    }
    .empty-state .eicon { font-size: 40px; }
    .empty-state p { font-size: 14px; }

    /* iframe view */
    #site-frame {
      width: 100%; height: 100%;
      border: none; display: none;
    }
    #site-frame.visible { display: block; }

    /* iframe blocked fallback */
    .blocked-card {
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 16px; color: var(--g600);
    }
    .blocked-card.visible { display: flex; }
    .blocked-card .big-icon { font-size: 48px; }
    .blocked-card p { font-size: 14px; color: var(--g500); }
    .open-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--blue); color: #fff;
      font-size: 14px; font-weight: 600;
      border-radius: 10px; padding: 11px 20px;
      text-decoration: none; border: none; cursor: pointer;
      font-family: inherit;
    }
    .open-btn:hover { background: #2272eb; }

    /* download toast */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--g900); color: #fff;
      font-size: 13px; font-weight: 500;
      border-radius: 10px; padding: 11px 20px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <span class="logo">nroad <span>education</span></span>
  <span class="badge">Design Refs</span>
  <span class="hcount" id="hcount"></span>
</header>

<div class="layout">
  <aside>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="브랜드 검색..." autocomplete="off" />
    </div>
    <div class="brand-list" id="brandList"></div>
  </aside>

  <main id="main">
    <div class="empty-state" id="emptyState">
      <div class="eicon">📐</div>
      <p>왼쪽에서 브랜드를 선택하세요</p>
    </div>
    <iframe id="site-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="blocked-card" id="blockedCard">
      <div class="big-icon">🔒</div>
      <p id="blockedMsg">이 사이트는 iframe 내 표시를 허용하지 않습니다.</p>
      <a id="openExternal" class="open-btn" href="#" target="_blank">↗ 새 탭으로 열기</a>
    </div>
  </main>
</div>

<div class="toast" id="toast">⬇️ <span id="toastMsg">다운로드 시작됨</span></div>

<script>
const brandData = {
  "airbnb":      "https://airbnb.com",
  "airtable":    "https://airtable.com",
  "apple":       "https://apple.com",
  "binance":     "https://binance.com",
  "bmw":         "https://bmw.com",
  "bmw-m":       "https://www.bmw.com/en/bmw-models/bmw-m.html",
  "bugatti":     "https://bugatti.com",
  "cal":         "https://cal.com",
  "claude":      "https://claude.ai",
  "clay":        "https://clay.com",
  "clickhouse":  "https://clickhouse.com",
  "cohere":      "https://cohere.com",
  "coinbase":    "https://coinbase.com",
  "composio":    "https://composio.dev",
  "cursor":      "https://cursor.com",
  "elevenlabs":  "https://elevenlabs.io",
  "expo":        "https://expo.dev",
  "ferrari":     "https://ferrari.com",
  "figma":       "https://figma.com",
  "framer":      "https://framer.com",
  "hashicorp":   "https://hashicorp.com",
  "ibm":         "https://ibm.com",
  "intercom":    "https://intercom.com",
  "kraken":      "https://kraken.com",
  "lamborghini": "https://lamborghini.com",
  "linear.app":  "https://linear.app",
  "lovable":     "https://lovable.dev",
  "mastercard":  "https://mastercard.com",
  "meta":        "https://meta.com",
  "minimax":     "https://minimaxi.com",
  "mintlify":    "https://mintlify.com",
  "miro":        "https://miro.com",
  "mistral.ai":  "https://mistral.ai",
  "mongodb":     "https://mongodb.com",
  "nike":        "https://nike.com",
  "notion":      "https://notion.so",
  "nvidia":      "https://nvidia.com",
  "ollama":      "https://ollama.com",
  "opencode.ai": "https://opencode.ai",
  "pinterest":   "https://pinterest.com",
  "playstation": "https://playstation.com",
  "posthog":     "https://posthog.com",
  "raycast":     "https://raycast.com",
  "renault":     "https://renault.com",
  "replicate":   "https://replicate.com",
  "resend":      "https://resend.com",
  "revolut":     "https://revolut.com",
  "runwayml":    "https://runwayml.com",
  "sanity":      "https://sanity.io",
  "sentry":      "https://sentry.io",
  "shopify":     "https://shopify.com",
  "slack":       "https://slack.com",
  "spacex":      "https://spacex.com",
  "spotify":     "https://spotify.com",
  "starbucks":   "https://starbucks.com",
  "stripe":      "https://stripe.com",
  "supabase":    "https://supabase.com",
  "superhuman":  "https://superhuman.com",
  "tesla":       "https://tesla.com",
  "theverge":    "https://theverge.com",
  "together.ai": "https://together.ai",
  "toss":        "https://toss.im",
  "uber":        "https://uber.com",
  "vercel":      "https://vercel.com",
  "vodafone":    "https://vodafone.com",
  "voltagent":   "https://voltagent.dev",
  "warp":        "https://warp.dev",
  "webflow":     "https://webflow.com",
  "wired":       "https://wired.com",
  "wise":        "https://wise.com",
  "x.ai":        "https://x.ai",
  "zapier":      "https://zapier.com",
};

const brands = Object.keys(brandData);
let currentBrand = null;
let currentSub = null;
let openBrand = null;

document.getElementById('hcount').textContent = `${brands.length}개 브랜드`;

// ── 토스트 알림
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── 사이드바 렌더
function renderList(filter = '') {
  const list = document.getElementById('brandList');
  const filtered = brands.filter(b => b.toLowerCase().includes(filter.toLowerCase()));
  if (!filtered.length) { list.innerHTML = '<div class="no-result">검색 결과 없음</div>'; return; }

  list.innerHTML = `<div class="sec-label">디자인 레퍼런스</div>` + filtered.map(b => {
    const isOpen = openBrand === b;
    return `
      <div class="brand-row ${isOpen ? 'open' : ''}" onclick="toggleBrand('${b}')">
        <div class="b-icon">${b[0]}</div>
        <span class="b-name">${b}</span>
        <span class="b-arrow">▶</span>
      </div>
      <div class="sub-list ${isOpen ? 'open' : ''}">
        <div class="sub-item ${currentBrand===b && currentSub==='design' ? 'active' : ''}"
             onclick="downloadDesign('${b}')">
          <span class="sub-icon">⬇️</span> 디자인 레퍼런스
        </div>
        <div class="sub-item ${currentBrand===b && currentSub==='site' ? 'active' : ''}"
             onclick="loadSite('${b}')">
          <span class="sub-icon">🌐</span> 레퍼런스 사이트
        </div>
      </div>
    `;
  }).join('');
}

function toggleBrand(brand) {
  openBrand = openBrand === brand ? null : brand;
  renderList(document.getElementById('search').value);
}

// ── 디자인 레퍼런스 → 파일 다운로드
function downloadDesign(brand) {
  currentBrand = brand;
  currentSub = 'design';
  renderList(document.getElementById('search').value);

  const a = document.createElement('a');
  a.href = `design-md/${brand}/DESIGN.md`;
  a.download = `${brand}-DESIGN.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast(`${brand} DESIGN.md 다운로드 중...`);
}

// ── 레퍼런스 사이트 → 우측 iframe
function loadSite(brand) {
  currentBrand = brand;
  currentSub = 'site';
  renderList(document.getElementById('search').value);

  const url = brandData[brand];
  const frame = document.getElementById('site-frame');
  const blocked = document.getElementById('blockedCard');
  const empty = document.getElementById('emptyState');

  empty.style.display = 'none';
  blocked.classList.remove('visible');
  frame.classList.remove('visible');

  // iframe 로드 시도
  frame.src = '';
  setTimeout(() => {
    frame.src = url;
    frame.classList.add('visible');
  }, 50);

  // X-Frame-Options 차단 감지 (load 이벤트가 와도 접근 불가)
  frame.onload = () => {
    try {
      // 같은 origin이면 접근 가능, 다르면 SecurityError
      const _ = frame.contentWindow.location.href;
    } catch(e) {
      // cross-origin이지만 로드 성공 — 정상 표시 유지
    }
  };
  frame.onerror = () => {
    frame.classList.remove('visible');
    document.getElementById('openExternal').href = url;
    document.getElementById('blockedMsg').textContent = `${url} — 이 사이트는 iframe 표시를 허용하지 않습니다.`;
    blocked.classList.add('visible');
  };
}

document.getElementById('search').addEventListener('input', e => {
  openBrand = null;
  renderList(e.target.value);
});

renderList();
</script>
</body>
</html>
