<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nroad education — Design Library</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange: #FF6B00;
  --orange-light: #FFF4EC;
  --orange-dark: #E55A00;
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --text-tertiary: #9CA3AF;
  --surface: #FFFFFF;
  --bg: #FAFAFA;
  --border: #E5E5E5;
  --radius: 8px;
  --radius-sm: 6px;
  --header-h: 52px;
  --sidebar-w: 220px;
}
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text-primary); line-height: 1.5; overflow: hidden; }

/* HEADER */
.header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 0 16px;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; color: var(--text-primary); }
.header-logo span { color: var(--orange); }
.header-tag {
  font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  background: var(--orange-light); color: var(--orange);
}
.header-right { display: flex; align-items: center; gap: 8px; }
.btn { font-family: inherit; cursor: pointer; font-size: 13px; font-weight: 600; border-radius: var(--radius-sm); transition: background 0.1s, color 0.1s; }
.btn-primary { background: var(--orange); color: #fff; border: none; padding: 7px 14px; }
.btn-primary:hover { background: var(--orange-dark); }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); padding: 7px 14px; }
.btn-ghost:hover { background: var(--bg); color: var(--text-primary); }
.btn-sm { font-size: 12px; padding: 5px 10px; }

/* LAYOUT */
.layout {
  display: flex;
  margin-top: var(--header-h);
  height: calc(100vh - var(--header-h));
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-search-wrap { padding: 10px 10px 6px; flex-shrink: 0; }
.sidebar-search {
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 12px; font-family: inherit;
  background: var(--bg); color: var(--text-primary);
  outline: none;
}
.sidebar-search:focus { border-color: var(--orange); }
.sidebar-scroll { flex: 1; overflow-y: auto; }
.section-label-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 12px 4px;
}
.section-label {
  font-size: 10px; font-weight: 700; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.6px;
}
.section-add-btn {
  font-size: 14px; line-height: 1; color: var(--text-tertiary);
  border: none; background: none; cursor: pointer; padding: 2px 5px; border-radius: 4px;
}
.section-add-btn:hover { color: var(--orange); background: var(--orange-light); }

/* brand items */
.brand-row {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 10px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s;
}
.brand-row:hover { background: var(--bg); }
.brand-row.active { background: var(--orange-light); border-left-color: var(--orange); }
.brand-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: #E5E5E5; color: var(--text-secondary);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; text-transform: uppercase;
}
.brand-row.active .brand-avatar { background: var(--orange); color: #fff; }
.brand-name-text { font-size: 13px; color: var(--text-secondary); flex: 1; }
.brand-row.active .brand-name-text { color: var(--text-primary); font-weight: 600; }
.brand-chevron { font-size: 10px; color: var(--text-tertiary); transition: transform 0.15s; display: inline-block; }
.brand-chevron.open { transform: rotate(90deg); }
.brand-children { overflow: hidden; }
.brand-child {
  display: flex; align-items: center;
  height: 32px; padding-left: 40px; padding-right: 10px;
  font-size: 12px; color: var(--text-secondary);
  cursor: pointer;
  text-decoration: none;
  border-left: 2px solid transparent;
  transition: background 0.1s;
}
.brand-child:hover { background: var(--bg); color: var(--text-primary); }
.brand-child.disabled { color: var(--text-tertiary); cursor: default; pointer-events: none; }
.brand-child .ext-ico { font-size: 10px; margin-left: 3px; opacity: 0.6; }

/* sample items */
.sample-add-row {
  display: flex; align-items: center;
  height: 36px; padding: 0 10px;
  cursor: pointer;
  font-size: 12px; color: var(--text-tertiary);
  border-left: 2px solid transparent;
  transition: background 0.1s;
  gap: 6px;
}
.sample-add-row:hover { background: var(--bg); color: var(--orange); }
.sample-row {
  display: flex; align-items: center;
  height: 40px; padding: 0 10px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s;
  gap: 8px;
}
.sample-row:hover { background: var(--bg); }
.sample-row.active { background: var(--orange-light); border-left-color: var(--orange); }
.sample-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.sample-row.active .sample-dot { background: var(--orange); }
.sample-name-text { font-size: 13px; color: var(--text-secondary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sample-row.active .sample-name-text { color: var(--text-primary); font-weight: 600; }

/* MAIN */
.main { flex: 1; overflow-y: auto; }

/* empty state */
.empty-state {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; color: var(--text-tertiary);
}
.empty-icon { font-size: 40px; opacity: 0.4; }
.empty-title { font-size: 16px; font-weight: 700; color: var(--text-secondary); }
.empty-desc { font-size: 13px; text-align: center; max-width: 240px; line-height: 1.6; }

/* panels */
.panel { padding: 28px 32px; }
.panel-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; }
.panel-desc { font-size: 13px; color: var(--text-tertiary); margin-bottom: 24px; }
.panel-actions { display: flex; gap: 8px; margin-top: 20px; }

.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
.form-input, .form-textarea {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; font-family: inherit; color: var(--text-primary);
  background: var(--surface); outline: none;
  transition: border-color 0.15s;
}
.form-input:focus, .form-textarea:focus { border-color: var(--orange); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-textarea.code { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; min-height: 220px; }

.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag {
  font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text-secondary);
}

/* brand edit panel */
.brand-edit-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.brand-edit-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--orange); color: #fff;
  font-size: 16px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  text-transform: uppercase; flex-shrink: 0;
}
.url-field-wrap { position: relative; }
.url-field-wrap .form-input { padding-right: 36px; }
.url-open-btn {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-size: 14px; background: none; border: none; cursor: pointer;
  color: var(--text-tertiary); padding: 2px;
}
.url-open-btn:hover { color: var(--orange); }

/* sample view */
.sample-view-wrap { display: flex; flex-direction: column; height: 100%; }
.sample-view-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sample-iframe {
  flex: 1; width: 100%; border: none; display: block;
}
.sample-view-btns { display: flex; gap: 8px; flex-shrink: 0; margin-left: 16px; }

/* divider */
.divider { height: 1px; background: var(--border); margin: 8px 10px; }

/* study items */
.study-cat-row {
  display: flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 10px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s;
}
.study-cat-row:hover { background: var(--bg); }
.study-cat-row.active { background: var(--orange-light); border-left-color: var(--orange); }
.study-cat-icon { font-size: 14px; flex-shrink: 0; }
.study-cat-text { font-size: 13px; color: var(--text-secondary); flex: 1; }
.study-cat-row.active .study-cat-text { color: var(--text-primary); font-weight: 600; }
.study-cat-chevron { font-size: 10px; color: var(--text-tertiary); transition: transform 0.15s; display: inline-block; }
.study-cat-chevron.open { transform: rotate(90deg); }
.study-item-row {
  display: flex; align-items: center; gap: 8px;
  height: 34px; padding-left: 32px; padding-right: 10px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s;
}
.study-item-row:hover { background: var(--bg); }
.study-item-row.active { background: var(--orange-light); border-left-color: var(--orange); }
.study-item-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.study-item-row.active .study-item-dot { background: var(--orange); }
.study-item-text { font-size: 12px; color: var(--text-secondary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.study-item-row.active .study-item-text { color: var(--text-primary); font-weight: 600; }

/* study view panel */
.study-view-wrap { padding: 32px 40px 48px; max-width: 800px; }
.study-view-header { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.study-view-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
.study-view-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.study-view-category { font-size: 12px; font-weight: 700; color: var(--orange); background: var(--orange-light); padding: 3px 10px; border-radius: 999px; }
.study-view-date { font-size: 12px; color: var(--text-tertiary); }
.study-content { font-size: 14px; line-height: 1.8; color: var(--text-primary); }
.study-content h2 { font-size: 18px; font-weight: 800; margin: 32px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--orange); display: inline-block; }
.study-content h3 { font-size: 15px; font-weight: 700; margin: 20px 0 8px; color: var(--text-primary); }
.study-content p { margin-bottom: 12px; }
.study-content ul, .study-content ol { padding-left: 20px; margin-bottom: 14px; }
.study-content li { margin-bottom: 6px; }
.study-content code { font-family: 'Consolas','Monaco',monospace; font-size: 12px; background: #F3F4F6; padding: 2px 6px; border-radius: 4px; color: #E55A00; }
.study-content pre { background: #1E1E2E; color: #CDD6F4; padding: 16px 20px; border-radius: 8px; font-size: 12px; font-family: 'Consolas','Monaco',monospace; overflow-x: auto; margin-bottom: 16px; line-height: 1.7; }
.study-content .tip-box { background: var(--orange-light); border-left: 3px solid var(--orange); padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 16px 0; font-size: 13px; }
.study-content .tip-box strong { color: var(--orange); }
.study-content .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }
.study-content .tool-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.study-content .tool-card .tool-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.study-content .tool-card .tool-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.study-content .tool-card .tool-url { font-size: 11px; color: var(--orange); margin-top: 6px; text-decoration: none; display: block; }
.study-content .step-list { counter-reset: step; list-style: none; padding-left: 0; }
.study-content .step-list li { counter-increment: step; display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-start; }
.study-content .step-list li::before { content: counter(step); width: 24px; height: 24px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.study-content .prompt-box { background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-size: 12px; font-family: 'Consolas','Monaco',monospace; line-height: 1.7; margin: 12px 0; color: #374151; white-space: pre-wrap; }
.study-content .links-list { list-style: none; padding: 0; }
.study-content .links-list li { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.study-content .links-list li:last-child { border-bottom: none; }
.study-content .links-list a { font-size: 13px; color: var(--orange); text-decoration: none; font-weight: 600; }
.study-content .links-list a:hover { text-decoration: underline; }
.study-content .links-list .link-desc { font-size: 12px; color: var(--text-tertiary); }
</style>
</head>

</div>

// ── STATE ─────────────────────────────────────────────
let brands = [];
let samples = [];
let studies = [];
let openBrands = new Set();
let openStudyCategories = new Set();
let selectedBrandId = null;
let selectedSampleId = null;
let selectedStudyId = null;
let searchQuery = "";

// ── STORAGE ───────────────────────────────────────────
function loadData() {
  const b = localStorage.getItem('nroad_brands');
  const s = localStorage.getItem('nroad_samples');
  const st = localStorage.getItem('nroad_studies');
  brands = b ? JSON.parse(b) : DEFAULT_BRANDS.map(x => ({...x}));
  samples = s ? JSON.parse(s) : DEFAULT_SAMPLES.map(x => ({...x}));
  studies = st ? JSON.parse(st) : DEFAULT_STUDIES.map(x => ({...x}));
  if (!b) saveBrands();
  if (!s) saveSamples();
  if (!st) saveStudies();
}
function saveBrands() { localStorage.setItem('nroad_brands', JSON.stringify(brands)); }
function saveSamples() { localStorage.setItem('nroad_samples', JSON.stringify(samples)); }
function saveStudies() { localStorage.setItem('nroad_studies', JSON.stringify(studies)); }

// ── UTILS ─────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escAttr(str) { return escHtml(str); }
function getInitial(name) { return (name || '?').charAt(0).toUpperCase(); }

// ── RENDER SIDEBAR ────────────────────────────────────
function renderSidebar() {
  const q = searchQuery.toLowerCase();
  const brandList = document.getElementById('brand-list');
  const sampleList = document.getElementById('sample-list');

  const filteredBrands = q ? brands.filter(b => b.name.toLowerCase().includes(q)) : brands;
  brandList.innerHTML = '';

  filteredBrands.forEach(brand => {
    const isOpen = openBrands.has(brand.id);
    const isActive = selectedBrandId === brand.id;

    const item = document.createElement('div');
    item.className = 'brand-item';

    const row = document.createElement('div');
    row.className = 'brand-row' + (isActive ? ' active' : '');

    const avatar = document.createElement('div');
    avatar.className = 'brand-avatar';
    avatar.textContent = getInitial(brand.name);

    const nameEl = document.createElement('span');
    nameEl.className = 'brand-name-text';
    nameEl.textContent = brand.name;

    const chev = document.createElement('span');
    chev.className = 'brand-chevron' + (isOpen ? ' open' : '');
    chev.textContent = '▶';

    row.appendChild(avatar);
    row.appendChild(nameEl);
    row.appendChild(chev);
    row.addEventListener('click', () => onBrandRowClick(brand.id));

    const children = document.createElement('div');
    children.className = 'brand-children';
    children.style.display = isOpen ? 'block' : 'none';

    // design doc link
    if (brand.designDocUrl) {
      const a = document.createElement('a');
      a.className = 'brand-child';
      a.href = brand.designDocUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = '디자인 레퍼런스 <span class="ext-ico">↗</span>';
      children.appendChild(a);
    } else {
      const span = document.createElement('span');
      span.className = 'brand-child disabled';
      span.textContent = '디자인 레퍼런스';
      children.appendChild(span);
    }

    // site link
    if (brand.siteUrl) {
      const a = document.createElement('a');
      a.className = 'brand-child';
      a.href = brand.siteUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = '레퍼런스 사이트 <span class="ext-ico">↗</span>';
      children.appendChild(a);
    } else {
      const span = document.createElement('span');
      span.className = 'brand-child disabled';
      span.textContent = '레퍼런스 사이트';
      children.appendChild(span);
    }

    item.appendChild(row);
    item.appendChild(children);
    brandList.appendChild(item);
  });

  const filteredSamples = q ? samples.filter(s => s.name.toLowerCase().includes(q)) : samples;
  sampleList.innerHTML = '';

  filteredSamples.forEach(sample => {
    const isActive = selectedSampleId === sample.id;
    const row = document.createElement('div');
    row.className = 'sample-row' + (isActive ? ' active' : '');

    const dot = document.createElement('div');
    dot.className = 'sample-dot';

    const nameEl = document.createElement('span');
    nameEl.className = 'sample-name-text';
    nameEl.textContent = sample.name;

    row.appendChild(dot);
    row.appendChild(nameEl);
    row.addEventListener('click', () => onSampleClick(sample.id));
    sampleList.appendChild(row);
  });

  // ── render studies ───────────────────────────────────
  const studyList = document.getElementById('study-list');
  studyList.innerHTML = '';

  // group by category
  const catMap = {};
  const filteredStudies = q ? studies.filter(st => st.title.toLowerCase().includes(q) || st.category.toLowerCase().includes(q)) : studies;
  filteredStudies.forEach(st => {
    if (!catMap[st.category]) catMap[st.category] = { icon: st.categoryIcon || '📚', items: [] };
    catMap[st.category].items.push(st);
  });

  Object.entries(catMap).forEach(([catName, catData]) => {
    const isCatOpen = openStudyCategories.has(catName);

    const catRow = document.createElement('div');
    catRow.className = 'study-cat-row';

    const catIcon = document.createElement('span');
    catIcon.className = 'study-cat-icon';
    catIcon.textContent = catData.icon;

    const catText = document.createElement('span');
    catText.className = 'study-cat-text';
    catText.textContent = catName;

    const catChev = document.createElement('span');
    catChev.className = 'study-cat-chevron' + (isCatOpen ? ' open' : '');
    catChev.textContent = '▶';

    catRow.appendChild(catIcon);
    catRow.appendChild(catText);
    catRow.appendChild(catChev);
    catRow.addEventListener('click', () => {
      if (openStudyCategories.has(catName)) openStudyCategories.delete(catName);
      else openStudyCategories.add(catName);
      renderSidebar();
    });

    const catChildren = document.createElement('div');
    catChildren.style.display = isCatOpen ? 'block' : 'none';

    catData.items.forEach(st => {
      const isActive = selectedStudyId === st.id;
      const row = document.createElement('div');
      row.className = 'study-item-row' + (isActive ? ' active' : '');

      const dot = document.createElement('div');
      dot.className = 'study-item-dot';

      const text = document.createElement('span');
      text.className = 'study-item-text';
      text.textContent = st.title;

      row.appendChild(dot);
      row.appendChild(text);
      row.addEventListener('click', () => onStudyClick(st.id));
      catChildren.appendChild(row);
    });

    studyList.appendChild(catRow);
    studyList.appendChild(catChildren);
  });
}

function showEmpty() {
  mainPanel.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🎨</div>
      <div class="empty-title">디자인 라이브러리</div>
      <div class="empty-desc">좌측에서 브랜드나 샘플을 선택하거나, 새 항목을 추가해보세요.</div>
    </div>
  `;
}

function showBrandEdit(brand, isNew) {
  const initial = isNew ? '?' : getInitial(brand.name);
  mainPanel.innerHTML = `
    <div class="panel">
      <div class="brand-edit-header">
        <div class="brand-edit-avatar">${escHtml(initial)}</div>
        <div>
          <div style="font-size:18px; font-weight:800;">${isNew ? '새 브랜드 추가' : escHtml(brand.name)}</div>
          <div style="font-size:12px; color:var(--text-tertiary);">${isNew ? '브랜드 정보를 입력하세요' : '브랜드 정보를 편집합니다'}</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">브랜드 이름</label>
        <input class="form-input" id="field-name" type="text" value="${isNew ? '' : escAttr(brand.name)}" placeholder="예: airbnb">
      </div>
      <div class="form-group">
        <label class="form-label">디자인 문서 URL</label>
        <div class="url-field-wrap">
          <input class="form-input" id="field-design-url" type="url" value="${isNew ? '' : escAttr(brand.designDocUrl || '')}" placeholder="https://...">
          ${!isNew && brand.designDocUrl ? `<button class="url-open-btn" onclick="window.open(document.getElementById('field-design-url').value,'_blank')">↗</button>` : ''}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">공식 사이트 URL</label>
        <div class="url-field-wrap">
          <input class="form-input" id="field-site-url" type="url" value="${isNew ? '' : escAttr(brand.siteUrl || '')}" placeholder="https://...">
          ${!isNew && brand.siteUrl ? `<button class="url-open-btn" onclick="window.open(document.getElementById('field-site-url').value,'_blank')">↗</button>` : ''}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">메모</label>
        <textarea class="form-textarea" id="field-notes" placeholder="자유롭게 메모...">${isNew ? '' : escHtml(brand.notes || '')}</textarea>
      </div>
      <div class="panel-actions">
        <button class="btn btn-primary" id="btn-save-brand">저장</button>
        ${!isNew ? `<button class="btn btn-ghost" id="btn-delete-brand" style="color:#F04452; border-color:#F04452;">삭제</button>` : ''}
        <button class="btn btn-ghost" id="btn-cancel-brand">취소</button>
      </div>
    </div>
  `;

  document.getElementById('btn-save-brand').addEventListener('click', () => {
    const name = document.getElementById('field-name').value.trim();
    if (!name) { alert('브랜드 이름을 입력해주세요.'); return; }
    const designDocUrl = document.getElementById('field-design-url').value.trim();
    const siteUrl = document.getElementById('field-site-url').value.trim();
    const notes = document.getElementById('field-notes').value;
    if (isNew) {
      const newId = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();
      const newBrand = { id: newId, name, designDocUrl, siteUrl, notes };
      brands.push(newBrand);
      selectedBrandId = newId;
      saveBrands();
      renderSidebar();
      showBrandEdit(newBrand, false);
    } else {
      const idx = brands.findIndex(b => b.id === brand.id);
      if (idx !== -1) {
        brands[idx] = { ...brands[idx], name, designDocUrl, siteUrl, notes };
        saveBrands();
        renderSidebar();
        showBrandEdit(brands[idx], false);
      }
    }
  });

  if (!isNew) {
    document.getElementById('btn-delete-brand').addEventListener('click', () => {
      if (confirm('"' + brand.name + '" 브랜드를 삭제하시겠습니까?')) {
        brands = brands.filter(b => b.id !== brand.id);
        saveBrands();
        selectedBrandId = null;
        openBrands.delete(brand.id);
        renderSidebar();
        showEmpty();
      }
    });
  }

  document.getElementById('btn-cancel-brand').addEventListener('click', () => {
    if (isNew) {
      selectedBrandId = null;
      renderSidebar();
      showEmpty();
    } else {
      showBrandEdit(brand, false);
    }
  });
}

function showSampleView(sample) {
  const tagsHtml = (sample.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
  mainPanel.style.overflow = 'hidden';
  mainPanel.innerHTML = `
    <div class="sample-view-wrap">
      <div class="sample-view-header">
        <div style="flex:1;">
          <div style="font-size:18px; font-weight:800; margin-bottom:4px;">${escHtml(sample.name)}</div>
          <div style="font-size:13px; color:var(--text-tertiary); margin-bottom:8px;">${escHtml(sample.desc || '')}</div>
          <div class="tag-list">${tagsHtml}</div>
          <div style="font-size:11px; color:var(--text-tertiary); margin-top:8px;">생성일: ${sample.createdAt || ''}</div>
        </div>
        <div class="sample-view-btns">
          <button class="btn btn-ghost btn-sm" id="btn-edit-sample">편집</button>
          <button class="btn btn-ghost btn-sm" id="btn-delete-sample" style="color:#F04452; border-color:#F04452;">삭제</button>
        </div>
      </div>
      <iframe
        class="sample-iframe"
        sandbox="allow-scripts"
        id="sample-iframe"
        style="flex:1; width:100%; border:none;"
      ></iframe>
    </div>
  `;

  // set srcdoc after render to avoid escaping issues
  const iframe = document.getElementById('sample-iframe');
  iframe.srcdoc = sample.html || '';

  document.getElementById('btn-edit-sample').addEventListener('click', () => {
    mainPanel.style.overflow = '';
    showSampleEdit(sample, false);
  });
  document.getElementById('btn-delete-sample').addEventListener('click', () => {
    if (confirm('"' + sample.name + '" 샘플을 삭제하시겠습니까?')) {
      samples = samples.filter(s => s.id !== sample.id);
      saveSamples();
      selectedSampleId = null;
      mainPanel.style.overflow = '';
      renderSidebar();
      showEmpty();
    }
  });
}

function showSampleEdit(sample, isNew) {
  mainPanel.style.overflow = '';
  mainPanel.innerHTML = `
    <div class="panel">
      <div class="panel-title">${isNew ? '새 샘플 추가' : '샘플 편집'}</div>
      <div class="panel-desc">${isNew ? '새로운 HTML 디자인 샘플을 저장합니다.' : '샘플 정보를 수정합니다.'}</div>
      <div class="form-group">
        <label class="form-label">샘플 이름</label>
        <input class="form-input" id="sfield-name" type="text" value="${isNew ? '' : escAttr(sample.name)}" placeholder="예: Clean-Dashboard">
      </div>
      <div class="form-group">
        <label class="form-label">설명</label>
        <textarea class="form-textarea" id="sfield-desc" placeholder="이 디자인의 특징을 설명해주세요...">${isNew ? '' : escHtml(sample.desc || '')}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">태그 (쉼표로 구분)</label>
        <input class="form-input" id="sfield-tags" type="text" value="${isNew ? '' : escAttr((sample.tags || []).join(', '))}" placeholder="예: dashboard, clean, toss">
      </div>
      <div class="form-group">
        <label class="form-label">HTML 코드 (전체)</label>
        <textarea class="form-textarea code" id="sfield-html" placeholder="&lt;!DOCTYPE html&gt;...">${isNew ? '' : escHtml(sample.html || '')}</textarea>
      </div>
      <div class="panel-actions">
        <button class="btn btn-primary" id="btn-save-sample">저장</button>
        <button class="btn btn-ghost" id="btn-cancel-sample">취소</button>
      </div>
    </div>
  `;

  document.getElementById('btn-save-sample').addEventListener('click', () => {
    const name = document.getElementById('sfield-name').value.trim();
    if (!name) { alert('샘플 이름을 입력해주세요.'); return; }
    const desc = document.getElementById('sfield-desc').value.trim();
    const tagsRaw = document.getElementById('sfield-tags').value;
    const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);
    const html = document.getElementById('sfield-html').value;
    const today = new Date().toISOString().slice(0, 10);

    if (isNew) {
      const newId = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();
      const newSample = { id: newId, name, desc, tags, html, createdAt: today };
      samples.push(newSample);
      selectedSampleId = newId;
      saveSamples();
      renderSidebar();
      showSampleView(newSample);
    } else {
      const idx = samples.findIndex(s => s.id === sample.id);
      if (idx !== -1) {
        samples[idx] = { ...samples[idx], name, desc, tags, html };
        saveSamples();
        renderSidebar();
        showSampleView(samples[idx]);
      }
    }
  });

  document.getElementById('btn-cancel-sample').addEventListener('click', () => {
    if (isNew) {
      selectedSampleId = null;
      renderSidebar();
      showEmpty();
    } else {
      showSampleView(sample);
    }
  });
}

// ── STUDY HANDLERS ────────────────────────────────────
function showStudyView(study) {
  mainPanel.style.overflow = '';
  const content = STUDY_CONTENT[study.id];
  if (content) {
    mainPanel.innerHTML = `<div style="overflow-y:auto; height:100%;">${content}</div>`;
  } else {
    mainPanel.innerHTML = `
      <div class="study-view-wrap">
        <div class="study-view-header">
          <div class="study-view-title">${escHtml(study.title)}</div>
          <div class="study-view-meta">
            <span class="study-view-category">${escHtml(study.category)}</span>
            <span class="study-view-date">${study.createdAt || ''}</span>
          </div>
        </div>
        <div class="study-content">
          <p style="color:var(--text-tertiary);">아직 내용이 없습니다. 추후 추가 예정입니다.</p>
        </div>
      </div>
    `;
  }
}

function onStudyClick(studyId) {
  selectedStudyId = studyId;
  selectedBrandId = null;
  selectedSampleId = null;
  mainPanel.style.overflow = '';
  renderSidebar();
  const study = studies.find(s => s.id === studyId);
  if (study) showStudyView(study);
}

// ── EVENT HANDLERS ────────────────────────────────────
function onBrandRowClick(brandId) {
  selectedBrandId = brandId;
  selectedSampleId = null;
  mainPanel.style.overflow = '';
  if (openBrands.has(brandId)) {
    openBrands.delete(brandId);
  } else {
    openBrands.add(brandId);
  }
  renderSidebar();
  const brand = brands.find(b => b.id === brandId);
  if (brand) showBrandEdit(brand, false);
}

function onSampleClick(sampleId) {
  selectedSampleId = sampleId;
  selectedBrandId = null;
  renderSidebar();
  const sample = samples.find(s => s.id === sampleId);
  if (sample) showSampleView(sample);
}

// ── SEARCH ────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', function() {
  searchQuery = this.value;
  renderSidebar();
});

// ── ADD BRAND ─────────────────────────────────────────
document.getElementById('btn-add-brand').addEventListener('click', () => {
  selectedBrandId = null;
  selectedSampleId = null;
  mainPanel.style.overflow = '';
  renderSidebar();
  showBrandEdit({}, true);
});

// ── ADD STUDY ─────────────────────────────────────────
document.getElementById('btn-add-study').addEventListener('click', () => {
  alert('스터디 항목 추가 기능은 준비 중입니다.');
});

// ── ADD SAMPLE ────────────────────────────────────────
document.getElementById('btn-add-sample').addEventListener('click', () => {
  selectedBrandId = null;
  selectedSampleId = null;
  mainPanel.style.overflow = '';
  renderSidebar();
  showSampleEdit({}, true);
});

// ── EXPORT JSON ───────────────────────────────────────
document.getElementById('btn-export').addEventListener('click', () => {
  const data = { brands, samples, studies, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nroad-design-library-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

// ── IMPORT JSON ───────────────────────────────────────
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('import-file-input').click();
});

document.getElementById('import-file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm('현재 데이터를 모두 덮어쓁니다. 계속하시겠습니까?')) return;
      if (data.brands) { brands = data.brands; saveBrands(); }
      if (data.samples) { samples = data.samples; saveSamples(); }
      if (data.studies) { studies = data.studies; saveStudies(); }
      selectedBrandId = null;
      selectedSampleId = null;
      openBrands.clear();
      mainPanel.style.overflow = '';
      renderSidebar();
      showEmpty();
      alert('가져오기 완료!');
    } catch(err) {
      alert('JSON 파싱 오류: ' + err.message);
    }
  };
  reader.readAsText(file);
  this.value = '';
});

// ── INIT ──────────────────────────────────────────────
loadData();
renderSidebar();
</script>
