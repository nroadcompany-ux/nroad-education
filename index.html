<meta charset="UTF-8">

<title>nroad education — Design Library</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange: #FF6B00;
  --orange-light: #FFF4EC;
  --orange-dark: #E55A00;
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --text-tertiary: #9CA3AF;
  --surface: #FFFFFF;
  --bg: #FAFAFA;
  --border: #E5E5E5;
  --radius: 8px;
  --radius-sm: 6px;
  --header-h: 52px;
  --sidebar-w: 220px;
}
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text-primary); line-height: 1.5; overflow: hidden; }

/* HEADER */
.header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 0 16px;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; color: var(--text-primary); }
.header-logo span { color: var(--orange); }
.header-tag {
  font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  background: var(--orange-light); color: var(--orange);
}
.header-right { display: flex; align-items: center; gap: 8px; }
.btn { font-family: inherit; cursor: pointer; font-size: 13px; font-weight: 600; border-radius: var(--radius-sm); transition: background 0.1s, color 0.1s; }
.btn-primary { background: var(--orange); color: #fff; border: none; padding: 7px 14px; }
.btn-primary:hover { background: var(--orange-dark); }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); padding: 7px 14px; }
.btn-ghost:hover { background: var(--bg); color: var(--text-primary); }
.btn-sm { font-size: 12px; padding: 5px 10px; }

/* LAYOUT */
.layout {
  display: flex;
  margin-top: var(--header-h);
  height: calc(100vh - var(--header-h));
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-search-wrap { padding: 10px 10px 6px; flex-shrink: 0; }
.sidebar-search {
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 12px; font-family: inherit;
  background: var(--bg); color: var(--text-primary);
  outline: none;
}
.sidebar-search:focus { border-color: var(--orange); }
.sidebar-scroll { flex: 1; overflow-y: auto; }
.section-label-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 12px 4px;
}
.section-label {
  font-size: 10px; font-weight: 700; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.6px;
}
.section-add-btn {
  font-size: 14px; line-height: 1; color: var(--text-tertiary);
  border: none; background: none; cursor: pointer; padding: 2px 5px; border-radius: 4px;
}
.section-add-btn:hover { color: var(--orange); background: var(--orange-light); }

/* brand items */
.brand-row {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 10px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s;
}
.brand-row:hover { background: var(--bg); }
.brand-row.active { background: var(--orange-light); border-left-color: var(--orange); }
.brand-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: #E5E5E5; color: var(--text-secondary);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; text-transform: uppercase;
}
.brand-row.active .brand-avatar { background: var(--orange); color: #fff; }
.brand-name-text { font-size: 13px; color: var(--text-secondary); flex: 1; }
.brand-row.active .brand-name-text { color: var(--text-primary); font-weight: 600; }
.brand-chevron { font-size: 10px; color: var(--text-tertiary); transition: transform 0.15s; display: inline-block; }
.brand-chevron.open { transform: rotate(90deg); }
.brand-children { overflow: hidden; }
.brand-child {
  display: flex; align-items: center;
  height: 32px; padding-left: 40px; padding-right: 10px;
  font-size: 12px; color: var(--text-secondary);
  cursor: pointer;
  text-decoration: none;
  border-left: 2px solid transparent;
  transition: background 0.1s;
}
.brand-child:hover { background: var(--bg); color: var(--text-primary); }
.brand-child.disabled { color: var(--text-tertiary); cursor: default; pointer-events: none; }
.brand-child .ext-ico { font-size: 10px; margin-left: 3px; opacity: 0.6; }

/* sample items */
.sample-add-row {
  display: flex; align-items: center;
  height: 36px; padding: 0 10px;
  cursor: pointer;
  font-size: 12px; color: var(--text-tertiary);
  border-left: 2px solid transparent;
  transition: background 0.1s;
  gap: 6px;
}
.sample-add-row:hover { background: var(--bg); color: var(--orange); }
.sample-row {
  display: flex; align-items: center;
  height: 40px; padding: 0 10px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s;
  gap: 8px;
}
.sample-row:hover { background: var(--bg); }
.sample-row.active { background: var(--orange-light); border-left-color: var(--orange); }
.sample-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.sample-row.active .sample-dot { background: var(--orange); }
.sample-name-text { font-size: 13px; color: var(--text-secondary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sample-row.active .sample-name-text { color: var(--text-primary); font-weight: 600; }

/* MAIN */
.main { flex: 1; overflow-y: auto; }

/* empty state */
.empty-state {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; color: var(--text-tertiary);
}
.empty-icon { font-size: 40px; opacity: 0.4; }
.empty-title { font-size: 16px; font-weight: 700; color: var(--text-secondary); }
.empty-desc { font-size: 13px; text-align: center; max-width: 240px; line-height: 1.6; }

/* panels */
.panel { padding: 28px 32px; }
.panel-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; }
.panel-desc { font-size: 13px; color: var(--text-tertiary); margin-bottom: 24px; }
.panel-actions { display: flex; gap: 8px; margin-top: 20px; }

.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
.form-input, .form-textarea {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; font-family: inherit; color: var(--text-primary);
  background: var(--surface); outline: none;
  transition: border-color 0.15s;
}
.form-input:focus, .form-textarea:focus { border-color: var(--orange); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-textarea.code { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; min-height: 220px; }

.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag {
  font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text-secondary);
}

/* brand edit panel */
.brand-edit-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.brand-edit-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--orange); color: #fff;
  font-size: 16px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  text-transform: uppercase; flex-shrink: 0;
}
.url-field-wrap { position: relative; }
.url-field-wrap .form-input { padding-right: 36px; }
.url-open-btn {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-size: 14px; background: none; border: none; cursor: pointer;
  color: var(--text-tertiary); padding: 2px;
}
.url-open-btn:hover { color: var(--orange); }

/* sample view */
.sample-view-wrap { display: flex; flex-direction: column; height: 100%; }
.sample-view-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sample-iframe {
  flex: 1; width: 100%; border: none; display: block;
}
.sample-view-btns { display: flex; gap: 8px; flex-shrink: 0; margin-left: 16px; }

/* divider */
.divider { height: 1px; background: var(--border); margin: 8px 10px; }
</style>

// ── STATE ─────────────────────────────────────────────
let brands = [];
let samples = [];
let openBrands = new Set();
let selectedBrandId = null;
let selectedSampleId = null;
let searchQuery = "";

// ── STORAGE ───────────────────────────────────────────
function loadData() {
  const b = localStorage.getItem('nroad_brands');
  const s = localStorage.getItem('nroad_samples');
  brands = b ? JSON.parse(b) : DEFAULT_BRANDS.map(x => ({...x}));
  samples = s ? JSON.parse(s) : DEFAULT_SAMPLES.map(x => ({...x}));
  if (!b) saveBrands();
  if (!s) saveSamples();
}
function saveBrands() { localStorage.setItem('nroad_brands', JSON.stringify(brands)); }
function saveSamples() { localStorage.setItem('nroad_samples', JSON.stringify(samples)); }

// ── UTILS ─────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escAttr(str) { return escHtml(str); }
function getInitial(name) { return (name || '?').charAt(0).toUpperCase(); }

// ── RENDER SIDEBAR ────────────────────────────────────
function renderSidebar() {
  const q = searchQuery.toLowerCase();
  const brandList = document.getElementById('brand-list');
  const sampleList = document.getElementById('sample-list');

  const filteredBrands = q ? brands.filter(b => b.name.toLowerCase().includes(q)) : brands;
  brandList.innerHTML = '';

  filteredBrands.forEach(brand => {
    const isOpen = openBrands.has(brand.id);
    const isActive = selectedBrandId === brand.id;

    const item = document.createElement('div');
    item.className = 'brand-item';

    const row = document.createElement('div');
    row.className = 'brand-row' + (isActive ? ' active' : '');

    const avatar = document.createElement('div');
    avatar.className = 'brand-avatar';
    avatar.textContent = getInitial(brand.name);

    const nameEl = document.createElement('span');
    nameEl.className = 'brand-name-text';
    nameEl.textContent = brand.name;

    const chev = document.createElement('span');
    chev.className = 'brand-chevron' + (isOpen ? ' open' : '');
    chev.textContent = '▶';

    row.appendChild(avatar);
    row.appendChild(nameEl);
    row.appendChild(chev);
    row.addEventListener('click', () => onBrandRowClick(brand.id));

    const children = document.createElement('div');
    children.className = 'brand-children';
    children.style.display = isOpen ? 'block' : 'none';

    // design doc link
    if (brand.designDocUrl) {
      const a = document.createElement('a');
      a.className = 'brand-child';
      a.href = brand.designDocUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = '디자인 레퍼런스 <span class="ext-ico">↗</span>';
      children.appendChild(a);
    } else {
      const span = document.createElement('span');
      span.className = 'brand-child disabled';
      span.textContent = '디자인 레퍼런스';
      children.appendChild(span);
    }

    // site link
    if (brand.siteUrl) {
      const a = document.createElement('a');
      a.className = 'brand-child';
      a.href = brand.siteUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = '레퍼런스 사이트 <span class="ext-ico">↗</span>';
      children.appendChild(a);
    } else {
      const span = document.createElement('span');
      span.className = 'brand-child disabled';
      span.textContent = '레퍼런스 사이트';
      children.appendChild(span);
    }

    item.appendChild(row);
    item.appendChild(children);
    brandList.appendChild(item);
  });

  const filteredSamples = q ? samples.filter(s => s.name.toLowerCase().includes(q)) : samples;
  sampleList.innerHTML = '';

  filteredSamples.forEach(sample => {
    const isActive = selectedSampleId === sample.id;
    const row = document.createElement('div');
    row.className = 'sample-row' + (isActive ? ' active' : '');

    const dot = document.createElement('div');
    dot.className = 'sample-dot';

    const nameEl = document.createElement('span');
    nameEl.className = 'sample-name-text';
    nameEl.textContent = sample.name;

    row.appendChild(dot);
    row.appendChild(nameEl);
    row.addEventListener('click', () => onSampleClick(sample.id));
    sampleList.appendChild(row);
  });
}

      </div>
    </div>
  `;

  document.getElementById('btn-save-brand').addEventListener('click', () => {
    const name = document.getElementById('field-name').value.trim();
    if (!name) { alert('브랜드 이름을 입력해주세요.'); return; }
    const designDocUrl = document.getElementById('field-design-url').value.trim();
    const siteUrl = document.getElementById('field-site-url').value.trim();
    const notes = document.getElementById('field-notes').value;
    if (isNew) {
      const newId = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();
      const newBrand = { id: newId, name, designDocUrl, siteUrl, notes };
      brands.push(newBrand);
      selectedBrandId = newId;
      saveBrands();
      renderSidebar();
      showBrandEdit(newBrand, false);

      const idx = brands.findIndex(b => b.id === brand.id);

    if (isNew) {
      selectedBrandId = null;
      renderSidebar();
      showEmpty();

      showBrandEdit(brand, false);
    }
  });
}

      showEmpty();
    } else {
      showSampleView(sample);
    }
  });
}

// ── EVENT HANDLERS ────────────────────────────────────
function onBrandRowClick(brandId) {
  selectedBrandId = brandId;
  selectedSampleId = null;
  mainPanel.style.overflow = '';
  if (openBrands.has(brandId)) {
    openBrands.delete(brandId);
  } else {
    openBrands.add(brandId);
  }
  renderSidebar();
  const brand = brands.find(b => b.id === brandId);
  if (brand) showBrandEdit(brand, false);
}

function onSampleClick(sampleId) {
  selectedSampleId = sampleId;
  selectedBrandId = null;
  renderSidebar();
  const sample = samples.find(s => s.id === sampleId);
  if (sample) showSampleView(sample);
}

// ── SEARCH ────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', function() {
  searchQuery = this.value;
  renderSidebar();
});

// ── ADD BRAND ─────────────────────────────────────────
document.getElementById('btn-add-brand').addEventListener('click', () => {
  selectedBrandId = null;
  selectedSampleId = null;
  mainPanel.style.overflow = '';
  renderSidebar();
  showBrandEdit({}, true);
});

// ── ADD SAMPLE ────────────────────────────────────────
document.getElementById('btn-add-sample').addEventListener('click', () => {
  selectedBrandId = null;
  selectedSampleId = null;
  mainPanel.style.overflow = '';
  renderSidebar();
  showSampleEdit({}, true);
});

// ── EXPORT JSON ───────────────────────────────────────
document.getElementById('btn-export').addEventListener('click', () => {
  const data = { brands, samples, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nroad-design-library-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

// ── IMPORT JSON ───────────────────────────────────────
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('import-file-input').click();
});

document.getElementById('import-file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm('현재 데이터를 모두 덮어쓁니다. 계속하시겠습니까?')) return;
      if (data.brands) { brands = data.brands; saveBrands(); }
      if (data.samples) { samples = data.samples; saveSamples(); }
      selectedBrandId = null;
      selectedSampleId = null;
      openBrands.clear();
      mainPanel.style.overflow = '';
      renderSidebar();
      showEmpty();
      alert('가져오기 완료!');
    } catch(err) {
      alert('JSON 파싱 오류: ' + err.message);
    }
  };
  reader.readAsText(file);
  this.value = '';
});

// ── INIT ──────────────────────────────────────────────
loadData();
renderSidebar();
</script>
</body>
</html>
