<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nroad education</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #3182f6; --blue-bg: #e8f3ff; --blue-hover: #c9e2ff;
      --g50: #f9fafb; --g100: #f2f4f6; --g200: #e5e8eb;
      --g300: #d1d6db; --g400: #b0b8c1; --g500: #8b95a1;
      --g600: #6b7684; --g700: #4e5968; --g800: #333d4b; --g900: #191f28;
      --sidebar-w: 272px;
    }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--g100); color: var(--g900);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ── Header */
    header {
      height: 52px; background: #fff; border-bottom: 1px solid var(--g200);
      display: flex; align-items: center; padding: 0 20px; gap: 10px;
      flex-shrink: 0; z-index: 20;
    }
    .logo { font-size: 15px; font-weight: 700; color: var(--blue); }
    .logo span { color: var(--g900); }
    .logo-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      background: var(--blue-bg); color: var(--blue);
      border-radius: 5px; padding: 2px 7px; text-transform: uppercase;
    }

    /* ── Layout */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar */
    aside {
      width: var(--sidebar-w); background: #fff;
      border-right: 1px solid var(--g200);
      display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
    }

    .search-box {
      padding: 10px 12px; border-bottom: 1px solid var(--g200); flex-shrink: 0;
    }
    .search-box input {
      width: 100%; height: 32px; background: var(--g100);
      border: none; border-radius: 7px; padding: 0 10px;
      font-size: 12px; font-family: inherit; color: var(--g900); outline: none;
    }
    .search-box input::placeholder { color: var(--g500); }
    .search-box input:focus { box-shadow: 0 0 0 2px var(--blue); }

    .nav-tree { overflow-y: auto; flex: 1; }

    /* ── Depth 1: Category */
    .d1-item {
      display: flex; align-items: center; gap: 9px;
      padding: 0 14px; height: 44px; cursor: pointer;
      border-bottom: 1px solid var(--g100);
      user-select: none;
    }
    .d1-item:hover { background: var(--g50); }
    .d1-icon { font-size: 15px; flex-shrink: 0; }
    .d1-label {
      flex: 1; font-size: 13px; font-weight: 700;
      color: var(--g900); letter-spacing: -0.2px;
    }
    .d1-arrow {
      font-size: 9px; color: var(--g400);
      transition: transform 0.15s;
    }
    .d1-item.open .d1-arrow { transform: rotate(90deg); }
    .d1-item.open { background: var(--g50); }
    .d1-count {
      font-size: 10px; font-weight: 600; color: var(--g500);
      background: var(--g100); border-radius: 10px;
      padding: 1px 6px; flex-shrink: 0;
    }

    .d1-body { display: none; }
    .d1-body.open { display: block; }

    /* ── Depth 2: Brand / Sub-section */
    .d2-item {
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px 0 28px; height: 36px; cursor: pointer;
      font-size: 12px; font-weight: 500; color: var(--g700);
      user-select: none;
    }
    .d2-item:hover { background: var(--g50); }
    .d2-item.open { color: var(--g900); font-weight: 600; }
    .d2-icon {
      width: 20px; height: 20px; border-radius: 4px;
      background: var(--g100); display: flex; align-items: center;
      justify-content: center; font-size: 10px; font-weight: 700;
      color: var(--g600); flex-shrink: 0; text-transform: uppercase;
    }
    .d2-item.open .d2-icon { background: var(--g900); color: #fff; }
    .d2-label { flex: 1; }
    .d2-arrow {
      font-size: 9px; color: var(--g400);
      transition: transform 0.15s;
    }
    .d2-item.open .d2-arrow { transform: rotate(90deg); }

    .d2-body { display: none; }
    .d2-body.open { display: block; }

    /* ── Depth 3: Actions */
    .d3-item {
      display: flex; align-items: center; gap: 7px;
      padding: 0 12px 0 52px; height: 32px; cursor: pointer;
      font-size: 11px; color: var(--g600);
      border-left: 2px solid transparent;
      user-select: none;
    }
    .d3-item:hover { background: var(--g50); color: var(--g800); }
    .d3-item.active {
      background: var(--blue-bg); color: var(--blue);
      border-left-color: var(--blue); font-weight: 600;
    }
    .d3-icon { font-size: 11px; flex-shrink: 0; }

    /* empty depth2 */
    .d2-empty {
      padding: 14px 28px 16px;
      font-size: 12px; color: var(--g400); font-style: italic;
    }
    .no-result { padding: 16px 14px; font-size: 12px; color: var(--g500); text-align: center; }

    /* ── Main */
    main { flex: 1; overflow: hidden; position: relative; background: var(--g100); }

    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; color: var(--g400); gap: 10px;
    }
    .empty-state .eicon { font-size: 36px; }
    .empty-state .etitle { font-size: 14px; font-weight: 600; color: var(--g600); }
    .empty-state .esub { font-size: 12px; color: var(--g400); }

    /* iframe */
    #site-frame { width: 100%; height: 100%; border: none; display: none; }
    #site-frame.visible { display: block; }

    /* iframe blocked */
    .blocked-wrap {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 14px;
    }
    .blocked-wrap.visible { display: flex; }
    .blocked-wrap .b-icon { font-size: 44px; }
    .blocked-wrap p { font-size: 13px; color: var(--g500); }
    .open-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--blue); color: #fff; font-size: 13px; font-weight: 600;
      border-radius: 9px; padding: 10px 18px; text-decoration: none;
      font-family: inherit; border: none; cursor: pointer;
    }
    .open-btn:hover { background: #2272eb; }

    /* toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--g900); color: #fff; font-size: 12px; font-weight: 500;
      border-radius: 9px; padding: 10px 18px;
      display: flex; align-items: center; gap: 7px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <span class="logo">nroad <span>education</span></span>
  <span class="logo-badge">AI Learning</span>
</header>

<div class="layout">
  <aside>
    <div class="search-box">
      <input type="text" id="search" placeholder="검색..." autocomplete="off" />
    </div>
    <div class="nav-tree" id="navTree"></div>
  </aside>

  <main id="main">
    <div class="empty-state" id="emptyState">
      <div class="eicon">🎓</div>
      <div class="etitle">nroad education</div>
      <div class="esub">왼쪽에서 항목을 선택하세요</div>
    </div>
    <iframe id="site-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
    <div class="blocked-wrap" id="blockedWrap">
      <div class="b-icon">🔒</div>
      <p id="blockedMsg">이 사이트는 iframe 표시를 허용하지 않습니다.</p>
      <a id="openExternal" class="open-btn" href="#" target="_blank">↗ 새 탭으로 열기</a>
    </div>
  </main>
</div>

<div class="toast" id="toast">⬇️ <span id="toastMsg"></span></div>

<script>
/* ─────────────────────────────
   데이터
───────────────────────────── */
const designBrands = {
  "airbnb":      "https://airbnb.com",
  "airtable":    "https://airtable.com",
  "apple":       "https://apple.com",
  "binance":     "https://binance.com",
  "bmw":         "https://bmw.com",
  "bmw-m":       "https://www.bmw.com/en/bmw-models/bmw-m.html",
  "bugatti":     "https://bugatti.com",
  "cal":         "https://cal.com",
  "claude":      "https://claude.ai",
  "clay":        "https://clay.com",
  "clickhouse":  "https://clickhouse.com",
  "cohere":      "https://cohere.com",
  "coinbase":    "https://coinbase.com",
  "composio":    "https://composio.dev",
  "cursor":      "https://cursor.com",
  "elevenlabs":  "https://elevenlabs.io",
  "expo":        "https://expo.dev",
  "ferrari":     "https://ferrari.com",
  "figma":       "https://figma.com",
  "framer":      "https://framer.com",
  "hashicorp":   "https://hashicorp.com",
  "ibm":         "https://ibm.com",
  "intercom":    "https://intercom.com",
  "kraken":      "https://kraken.com",
  "lamborghini": "https://lamborghini.com",
  "linear.app":  "https://linear.app",
  "lovable":     "https://lovable.dev",
  "mastercard":  "https://mastercard.com",
  "meta":        "https://meta.com",
  "minimax":     "https://minimaxi.com",
  "mintlify":    "https://mintlify.com",
  "miro":        "https://miro.com",
  "mistral.ai":  "https://mistral.ai",
  "mongodb":     "https://mongodb.com",
  "nike":        "https://nike.com",
  "notion":      "https://notion.so",
  "nvidia":      "https://nvidia.com",
  "ollama":      "https://ollama.com",
  "opencode.ai": "https://opencode.ai",
  "pinterest":   "https://pinterest.com",
  "playstation": "https://playstation.com",
  "posthog":     "https://posthog.com",
  "raycast":     "https://raycast.com",
  "renault":     "https://renault.com",
  "replicate":   "https://replicate.com",
  "resend":      "https://resend.com",
  "revolut":     "https://revolut.com",
  "runwayml":    "https://runwayml.com",
  "sanity":      "https://sanity.io",
  "sentry":      "https://sentry.io",
  "shopify":     "https://shopify.com",
  "slack":       "https://slack.com",
  "spacex":      "https://spacex.com",
  "spotify":     "https://spotify.com",
  "starbucks":   "https://starbucks.com",
  "stripe":      "https://stripe.com",
  "supabase":    "https://supabase.com",
  "superhuman":  "https://superhuman.com",
  "tesla":       "https://tesla.com",
  "theverge":    "https://theverge.com",
  "together.ai": "https://together.ai",
  "toss":        "https://toss.im",
  "uber":        "https://uber.com",
  "vercel":      "https://vercel.com",
  "vodafone":    "https://vodafone.com",
  "voltagent":   "https://voltagent.dev",
  "warp":        "https://warp.dev",
  "webflow":     "https://webflow.com",
  "wired":       "https://wired.com",
  "wise":        "https://wise.com",
  "x.ai":        "https://x.ai",
  "zapier":      "https://zapier.com",
};

// ── 구현 샘플 데이터 (추가/수정 시 여기만 편집)
const mySamples = [
  // { id: 'toss-card', label: 'Toss-Card', icon: '💳', previewUrl: 'samples/toss-card.html' },
  // { id: 'clean-dashboard', label: 'Clean-Dashboard', icon: '📊', previewUrl: 'samples/clean-dashboard.html' },
  // 새 샘플 추가: { id: '파일명', label: '표시이름', icon: '이모지', previewUrl: 'samples/파일명.html' }
];

// 뎁스 1 카테고리 정의
const categories = [
  {
    id: 'study',
    icon: '📚',
    label: '개발 스터디',
    empty: '콘텐츠 준비 중...',
    d2: []
  },
  {
    id: 'samples',
    icon: '🖥️',
    label: '구현 샘플',
    empty: '샘플을 추가해주세요',
    d2: mySamples.map(s => ({
      id: s.id,
      label: s.label,
      icon: s.icon || s.label[0].toUpperCase(),
      d3: [
        { id: 'preview', icon: '👁️', label: '미리보기', action: () => loadSample(s.previewUrl, s.label) },
        { id: 'download', icon: '⬇️', label: '파일 다운로드', action: () => downloadSample(s.previewUrl, s.id) },
      ]
    }))
  },
  {
    id: 'design',
    icon: '🎨',
    label: '개발 디자인',
    d2: Object.keys(designBrands).map(b => ({
      id: b,
      label: b,
      icon: b[0].toUpperCase(),
      d3: [
        { id: 'dl', icon: '⬇️', label: '디자인 레퍼런스', action: () => downloadDesign(b) },
        { id: 'site', icon: '🌐', label: '레퍼런스 사이트', action: () => loadSite(b) },
      ]
    }))
  }
];

/* ─────────────────────────────
   상태
───────────────────────────── */
let openD1 = 'design';
let openD2 = null;
let activeKey = null; // `${catId}/${brandId}/${d3Id}`

/* ─────────────────────────────
   렌더
───────────────────────────── */
function render(filter = '') {
  const tree = document.getElementById('navTree');
  const q = filter.toLowerCase();

  tree.innerHTML = categories.map(cat => {
    const isD1Open = openD1 === cat.id;

    // 검색 필터링
    const filtered = cat.d2.filter(d2 => !q || d2.label.toLowerCase().includes(q));
    const show = !q || filtered.length > 0;
    if (!show) return '';

    const d2Html = filtered.length === 0
      ? `<div class="d2-empty">${cat.empty || '항목 없음'}</div>`
      : filtered.map(d2 => {
          const isD2Open = openD2 === `${cat.id}/${d2.id}`;
          const d3Html = d2.d3.map(d3 => {
            const key = `${cat.id}/${d2.id}/${d3.id}`;
            return `<div class="d3-item ${activeKey === key ? 'active' : ''}"
                        onclick="handleD3('${cat.id}','${d2.id}','${d3.id}')">
                      <span class="d3-icon">${d3.icon}</span>${d3.label}
                    </div>`;
          }).join('');
          return `
            <div class="d2-item ${isD2Open ? 'open' : ''}"
                 onclick="toggleD2('${cat.id}','${d2.id}')">
              <div class="d2-icon">${d2.icon}</div>
              <span class="d2-label">${d2.label}</span>
              <span class="d2-arrow">▶</span>
            </div>
            <div class="d2-body ${isD2Open ? 'open' : ''}">${d3Html}</div>
          `;
        }).join('');

    return `
      <div class="d1-item ${isD1Open ? 'open' : ''}" onclick="toggleD1('${cat.id}')">
        <span class="d1-icon">${cat.icon}</span>
        <span class="d1-label">${cat.label}</span>
        ${cat.d2.length ? `<span class="d1-count">${cat.d2.length}</span>` : ''}
        <span class="d1-arrow">▶</span>
      </div>
      <div class="d1-body ${isD1Open ? 'open' : ''}">${d2Html}</div>
    `;
  }).join('');
}

function toggleD1(id) {
  openD1 = openD1 === id ? null : id;
  render(document.getElementById('search').value);
}

function toggleD2(catId, d2Id) {
  const key = `${catId}/${d2Id}`;
  openD2 = openD2 === key ? null : key;
  render(document.getElementById('search').value);
}

function handleD3(catId, d2Id, d3Id) {
  activeKey = `${catId}/${d2Id}/${d3Id}`;
  // find action
  const cat = categories.find(c => c.id === catId);
  const d2 = cat?.d2.find(d => d.id === d2Id);
  const d3 = d2?.d3.find(d => d.id === d3Id);
  d3?.action();
  render(document.getElementById('search').value);
}

/* ─────────────────────────────
   액션: 구현 샘플 미리보기
───────────────────────────── */
function loadSample(url, label) {
  const frame = document.getElementById('site-frame');
  const blocked = document.getElementById('blockedWrap');
  const empty = document.getElementById('emptyState');
  empty.style.display = 'none';
  blocked.classList.remove('visible');
  frame.classList.remove('visible');
  frame.src = '';
  setTimeout(() => { frame.src = url; frame.classList.add('visible'); }, 30);
  frame.onerror = () => showBlocked(url);
}

/* ─────────────────────────────
   액션: 구현 샘플 다운로드
───────────────────────────── */
function downloadSample(url, id) {
  const a = document.createElement('a');
  a.href = url;
  a.download = `${id}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast(`${id}.html 다운로드 중...`);
}

/* ─────────────────────────────
   액션: 디자인 레퍼런스 다운로드
───────────────────────────── */
function downloadDesign(brand) {
  const a = document.createElement('a');
  a.href = `design-md/${brand}/DESIGN.md`;
  a.download = `${brand}-DESIGN.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast(`${brand} DESIGN.md 다운로드 중...`);
}

/* ─────────────────────────────
   액션: 사이트 iframe
───────────────────────────── */
function loadSite(brand) {
  const url = designBrands[brand];
  const frame = document.getElementById('site-frame');
  const blocked = document.getElementById('blockedWrap');
  const empty = document.getElementById('emptyState');

  empty.style.display = 'none';
  blocked.classList.remove('visible');
  frame.classList.remove('visible');
  frame.src = '';

  setTimeout(() => {
    frame.src = url;
    frame.classList.add('visible');
  }, 30);

  frame.onerror = () => showBlocked(url);

  // 일부 사이트는 load 이벤트는 오지만 빈 페이지 — 타임아웃으로 감지
  const timer = setTimeout(() => {
    try {
      if (!frame.contentDocument || frame.contentDocument.body?.innerHTML === '')
        showBlocked(url);
    } catch(e) { /* cross-origin — 정상 */ }
  }, 5000);
  frame.onload = () => clearTimeout(timer);
}

function showBlocked(url) {
  const frame = document.getElementById('site-frame');
  const blocked = document.getElementById('blockedWrap');
  frame.classList.remove('visible');
  document.getElementById('openExternal').href = url;
  document.getElementById('blockedMsg').textContent = `이 사이트는 iframe 표시를 허용하지 않습니다.`;
  blocked.classList.add('visible');
}

/* ─────────────────────────────
   토스트
───────────────────────────── */
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ─────────────────────────────
   검색
───────────────────────────── */
document.getElementById('search').addEventListener('input', e => {
  if (e.target.value) openD1 = 'design';
  render(e.target.value);
});

/* ─────────────────────────────
   초기화
───────────────────────────── */
render();
</script>
</body>
</html>
